name: expense_tracker
description: Offline-first personal expense tracker with budgeting, lending, splits, and net-worth.
publish_to: "none"
version: 0.10.0+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Offline DB
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  # Security: PIN/recovery hashes go to the OS keychain, biometrics to the
  # system prompt (MainActivity is a FlutterFragmentActivity for local_auth).
  cryptography: ^2.7.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  # Encrypted .etbak export/import (archive = pure Dart, the picker is native).
  archive: ^3.6.1
  file_picker: ^13.1.0
  # Charts / UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  # Home-screen quick-add tile (2-tap cash spend). Applies the Kotlin Gradle
  # plugin, so Flutter prints a future-compat warning — it builds today.
  home_widget: ^0.10.0
  # On-device OCR for shared screenshots. 0.17.x is the last line that builds
  # on the pinned compileSdk 36 with jvmTarget 11; recognition is offline
  # (Latin script model bundled in the APK).
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
