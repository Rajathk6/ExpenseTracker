name: expense_tracker
description: Offline-first personal expense tracker with budgeting, lending, splits, and net-worth.
publish_to: "none"
version: 0.8.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Offline DB
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  # Security plugins (local_auth, secure_storage) are Phase 10 — re-added then.
  # Pure-Dart crypto stays for future PIN hashing.
  cryptography: ^2.7.0
  # Backup / share intake / OCR / widgets are Phase 9-10 (native deps re-added
  # then at then-current versions — pure-Dart share_parser + ZIP stay).
  archive: ^3.6.1
  # Charts / UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  # OCR for payment screenshots (Phase 9; re-added then)
  # Home widget / quick add (Phase 9; re-added then)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
