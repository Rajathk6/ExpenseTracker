name: expense_tracker
description: Offline-first personal expense tracker with budgeting, lending, splits, and net-worth.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Offline DB
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  # Security
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  # Backup / share intake
  receive_sharing_intent: ^1.8.0
  share_plus: ^10.1.2
  file_picker: ^8.0.0
  archive: ^3.6.1
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  # Charts / UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  # OCR for payment screenshots (on-device, offline)
  google_mlkit_text_recognition: ^0.13.1
  # Home widget / quick add
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
